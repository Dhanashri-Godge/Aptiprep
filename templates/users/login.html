<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="width: 400px;">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-success">Login</h2>
        <p class="text-muted">Welcome back! Please log in.</p>
      </div>
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_name" class="form-label">Name</label>
            <input type="text" class="form-control" id="id_name" name="username" required>  <!-- ✅ Changed to 'name' -->
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" class="form-control" id="id_password" name="password" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-success">Login</button>
        </div>
    </form>
    
      <div class="text-center mt-3">
        <p>Don't have an account? <a href="{% url 'register' %}" class="text-success">Register here</a></p>
      </div>
    </div>
  </div>
</body>
</html>
