<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .register-container {
      max-width: 400px;
      width: 100%;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .register-card {
      padding: 30px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container-fluid vh-100 d-flex flex-column">
    
    <div class="row flex-grow-1">
      <!-- Left Section: Company Info -->
      <div class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-success text-white p-5">
        <h1 class="fw-bold fs-1">Welcome to Aptiprep</h1>
        <p class="mt-3 text-center w-75">
          Join us to unlock your full potential! Participate in quizzes, polls, surveys, and real-time tests to boost your knowledge and skills.
        </p>
      </div>

      <!-- Right Section: Registration Form -->
      <div class="col-md-6 d-flex justify-content-center align-items-center bg-body-tertiary p-5">
        <div class="card shadow-sm register-container">
          <div class="card-body register-card">
            <h2 class="fw-bold text-center mb-4">Register</h2>

            <form method="post">
              {% csrf_token %}
              
              <div class="form-group">
                <label class="form-label">UserName</label>
                {{ form.username }}
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                {{ form.email }}
              </div>
              <div class="form-group">
                <label class="form-label">Password</label>
                {{ form.password1 }}
              </div>
              <div class="form-group">
                <label class="form-label">Confirm Password</label>
                {{ form.password2 }}
              </div>
              <div class="form-group">
                <label class="form-label">Role</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="role" value="student" id="student" required>
                  <label class="form-check-label" for="student">Student</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="role" value="faculty" id="faculty" required>
                  <label class="form-check-label" for="faculty">Faculty</label>
                </div>
              </div>

              <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
            </form>

            <div class="text-center mt-3">
              <p class="mb-0">Already have an account? <a href="{% url 'login' %}" class="text-success fw-bold">Login here</a></p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
