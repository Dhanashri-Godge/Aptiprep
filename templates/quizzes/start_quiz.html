{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center text-success">{{ quiz.title }}</h2>
    <form method="post" action="{% url 'submit_quiz' quiz.id %}">
        {% csrf_token %}
        {% for question in questions %}
        <div class="mb-3">
            <p class="fw-bold">{{ question.text }}</p>
            {% for option in question.options.all %}
            <div class="form-check">
                <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ option.id }}">
                <label class="form-check-label">{{ option.text }}</label>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Submit Quiz</button>
    </form>
</div>
{% endblock %}
