{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center text-success">{{ quiz.title }}</h2>
    
    <!-- Timer Display -->
    <div id="timer" class="alert alert-info text-center" role="alert">
      Time Remaining: <span id="timeLeft"></span>
    </div>
    
    <form id="quizForm" method="post" action="{% url 'submit_quiz' quiz.id %}">
        {% csrf_token %}
        {% for question in questions %}
        <div class="question-container" style="display: none;">
            <div class="mb-3">
                <p class="fw-bold">Q{{ forloop.counter }}: {{ question.text }}</p>
                {% for option in question.options.all %}
                <div class="form-check">
                    <input class="form-check-input" type="radio" 
                           name="question_{{ question.id }}" 
                           id="option_{{ option.id }}" 
                           value="{{ option.id }}">
                    <label class="form-check-label" for="option_{{ option.id }}">
                        {{ option.text }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
        
        <!-- Navigation Buttons -->
        <div class="d-flex justify-content-between mt-3">
            <button type="button" id="prevBtn" class="btn btn-secondary" onclick="changeQuestion(-1)" disabled>Previous</button>
            <button type="button" id="nextBtn" class="btn btn-primary" onclick="changeQuestion(1)">Next</button>
            <button type="submit" id="submitBtn" class="btn btn-success" style="display: none;">Submit Quiz</button>
        </div>
    </form>
</div>

<script>
  // Timer: Set total time (duration in minutes converted to seconds)
  let totalTime = {{ quiz.duration }} * 60;  
  let timerInterval = setInterval(function() {
      let minutes = Math.floor(totalTime / 60);
      let seconds = totalTime % 60;
      document.getElementById('timeLeft').innerText = minutes + "m " + seconds + "s";
      if (totalTime <= 0) {
          clearInterval(timerInterval);
          document.getElementById('quizForm').submit();
      }
      totalTime--;
  }, 1000);

  // Question Navigation
  let currentQuestion = 0;
  const questions = document.getElementsByClassName('question-container');

  function showQuestion(index) {
      // Hide all questions
      for (let i = 0; i < questions.length; i++) {
          questions[i].style.display = 'none';
      }
      // Show the current question
      questions[index].style.display = 'block';

      // Update navigation buttons
      document.getElementById('prevBtn').disabled = (index === 0);
      if (index === questions.length - 1) {
          document.getElementById('nextBtn').style.display = 'none';
          document.getElementById('submitBtn').style.display = 'inline-block';
      } else {
          document.getElementById('nextBtn').style.display = 'inline-block';
          document.getElementById('submitBtn').style.display = 'none';
      }
  }

  function changeQuestion(n) {
      currentQuestion += n;
      if (currentQuestion < 0) currentQuestion = 0;
      if (currentQuestion >= questions.length) currentQuestion = questions.length - 1;
      showQuestion(currentQuestion);
  }

  document.addEventListener('DOMContentLoaded', function() {
      if (questions.length > 0) {
          showQuestion(currentQuestion);
      }
  });
</script>
{% endblock %}
