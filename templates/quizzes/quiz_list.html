{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center text-success">Available Quizzes</h2>
    <div class="row">
        {% for quiz in quizzes %}
        <div class="col-md-4">
            <div class="card shadow-sm p-3 mb-4">
                <div class="card-body">
                    <h5 class="card-title">{{ quiz.title }}</h5>
                    <p class="card-text">Category: {{ quiz.category }}</p>
                    <p class="card-text">Duration: {{ quiz.duration }} min</p>
                    <a href="{% url 'start_quiz' quiz.id %}" class="btn btn-success">Start Quiz</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
